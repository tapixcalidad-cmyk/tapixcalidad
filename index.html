<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tapixcalidad — Sistema de Gestión</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
:root{--gold:#C9A84C;--gold2:#E8C97A;--bg:#0F0E0C;--bg2:#1A1916;--bg3:#252420;--bg4:#2E2D29;--border:#3A3935;--border2:#4A4944;--text:#F0EDE6;--text2:#9E9B93;--text3:#6A6862;--red:#E05555;--green:#5CB87A;--blue:#5B9BD5;--amber:#D4923A;--r:10px;--r2:14px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:48px 40px;width:100%;max-width:380px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,0.5);}
.login-icon{width:56px;height:56px;background:var(--gold);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:26px;}
.login-title{font-size:24px;font-weight:700;margin-bottom:4px;}
.login-sub{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.15em;margin-bottom:36px;}
.btn-google{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;color:#333;border:none;border-radius:12px;padding:14px 20px;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.2s;box-shadow:0 2px 8px rgba(0,0,0,0.2);}
.btn-google:hover{background:#f5f5f5;transform:translateY(-1px);}
.btn-google img{width:20px;height:20px;}
.login-note{font-size:11px;color:var(--text3);margin-top:20px;}

/* APP LAYOUT */
.app{display:flex;min-height:100vh;}
.sidebar{width:210px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:100;transition:width 0.2s;}
.sidebar.collapsed{width:58px;}
.brand{padding:20px 16px 16px;border-bottom:1px solid var(--border);}
.brand-icon{width:34px;height:34px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.brand-text{margin-top:8px;overflow:hidden;}
.brand-name{font-size:15px;font-weight:700;white-space:nowrap;}
.brand-sub{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;white-space:nowrap;}
.sidebar.collapsed .brand-text,.sidebar.collapsed .nav-label,.sidebar.collapsed .nav-text,.sidebar.collapsed .nav-badge,.sidebar.collapsed .user-info,.sidebar.collapsed .brand-name,.sidebar.collapsed .brand-sub{display:none;}
.nav{padding:8px 0;flex:1;overflow-y:auto;}
.nav-label{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;padding:10px 16px 4px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:1px 6px;border-radius:var(--r);cursor:pointer;color:var(--text2);font-size:13px;transition:all 0.15s;user-select:none;}
.nav-item:hover{background:var(--bg3);color:var(--text);}
.nav-item.active{background:rgba(201,168,76,0.15);color:var(--gold2);font-weight:500;}
.sidebar.collapsed .nav-item{justify-content:center;padding:10px;}
.nav-icon{font-size:16px;flex-shrink:0;}
.nav-badge{margin-left:auto;background:var(--gold);color:var(--bg);border-radius:20px;font-size:10px;font-weight:700;padding:1px 6px;}
.nav-badge.red{background:var(--red);}
.sidebar-footer{padding:12px;border-top:1px solid var(--border);}
.user-info{font-size:11px;color:var(--text3);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.btn-signout{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3);cursor:pointer;padding:6px;border-radius:var(--r);transition:all 0.15s;background:none;border:none;width:100%;}
.btn-signout:hover{color:var(--red);background:rgba(224,85,85,0.1);}

/* MAIN */
.main{margin-left:210px;flex:1;display:flex;flex-direction:column;min-height:100vh;transition:margin-left 0.2s;}
.main.collapsed{margin-left:58px;}
.topbar{padding:14px 24px;border-bottom:1px solid var(--border);background:var(--bg);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;}
.topbar-toggle{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:4px;border-radius:6px;display:flex;}
.topbar-toggle:hover{color:var(--text);background:var(--bg3);}
.topbar h1{font-size:17px;font-weight:600;}
.content{padding:20px 24px;flex:1;}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-bottom:16px;}
.card-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:13px;font-weight:600;}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
.metric{background:var(--bg3);border-radius:var(--r2);padding:14px 16px;}
.metric-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px;}
.metric-val{font-size:22px;font-weight:600;}
.metric-sub{font-size:11px;color:var(--text3);margin-top:3px;}

/* TABLE */
table{width:100%;border-collapse:collapse;}
th{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;padding:9px 14px;text-align:left;border-bottom:1px solid var(--border);background:var(--bg3);white-space:nowrap;}
td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--bg3);}
.table-wrap{overflow-x:auto;}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;}
.badge-gray{background:var(--bg4);color:var(--text2);}
.badge-green{background:rgba(92,184,122,0.15);color:var(--green);}
.badge-amber{background:rgba(212,146,58,0.15);color:var(--amber);}
.badge-blue{background:rgba(91,155,213,0.15);color:var(--blue);}
.badge-red{background:rgba(224,85,85,0.15);color:var(--red);}
.badge-gold{background:rgba(201,168,76,0.15);color:var(--gold2);}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text2);font-family:'Inter',sans-serif;transition:all 0.15s;}
.btn:hover{background:var(--bg3);color:var(--text);}
.btn-gold{background:var(--gold);color:var(--bg);border:none;}.btn-gold:hover{background:var(--gold2);}
.btn-danger{background:rgba(224,85,85,0.1);color:var(--red);border-color:rgba(224,85,85,0.2);}.btn-danger:hover{background:rgba(224,85,85,0.2);}
.btn-sm{padding:4px 10px;font-size:11px;}
.btn-icon{padding:5px;font-size:14px;}

/* FORMS */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-group{display:flex;flex-direction:column;gap:5px;}
.form-group.full{grid-column:1/-1;}
.form-label{font-size:10px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em;}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=password],select,textarea{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:8px 11px;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;outline:none;width:100%;transition:border 0.15s;}
input:focus,select:focus,textarea:focus{border-color:var(--gold);}
input::placeholder,textarea::placeholder{color:var(--text3);}
input[readonly]{opacity:0.6;cursor:not-allowed;}
select option{background:var(--bg3);}
textarea{resize:vertical;min-height:65px;}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:none;align-items:center;justify-content:center;padding:16px;}
.overlay.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);width:100%;max-width:640px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,0.5);}
.modal-sm{max-width:440px;}
.modal-header{padding:16px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg2);z-index:1;}
.modal-title{font-size:15px;font-weight:600;}
.modal-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;line-height:1;padding:2px 6px;border-radius:6px;}
.modal-close:hover{color:var(--text);background:var(--bg4);}
.modal-body{padding:16px 20px;}
.modal-footer{padding:10px 20px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}

/* MISC */
.sep{border:none;border-top:1px solid var(--border);margin:16px 0;}
.sec-tag{font-size:10px;font-weight:500;color:var(--blue);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:9px;}
.presup-total{background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.25);border-radius:var(--r);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.presup-total span{font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:0.07em;}
.presup-total strong{font-size:18px;font-weight:700;color:var(--gold);}
.pago-row{display:flex;gap:7px;align-items:center;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;margin-bottom:7px;}
.pago-row select{width:135px;flex-shrink:0;}
.saldo-bar{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:9px 13px;display:flex;justify-content:space-between;font-size:13px;}
.mat-header{display:grid;grid-template-columns:1fr 58px 90px 78px 68px 24px;gap:4px;padding:0 8px;margin-bottom:4px;}
.mat-header span{font-size:9px;color:var(--text3);text-transform:uppercase;}
.mat-row{display:grid;grid-template-columns:1fr 58px 90px 78px 68px 24px;gap:4px;align-items:center;background:var(--bg3);border-radius:var(--r);padding:7px 8px;margin-bottom:4px;}
.mat-row input,.mat-row select{padding:4px 7px;font-size:11px;}
.mat-sub{font-size:11px;color:var(--gold);font-weight:600;text-align:right;}
.mat-total-row{background:rgba(201,168,76,0.08);border:1px solid rgba(201,168,76,0.18);border-radius:var(--r);padding:6px 10px;display:flex;justify-content:space-between;margin:4px 0 8px;font-size:12px;}
.mat-total-row span{color:var(--gold);}
.nota-rapida{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:11px;cursor:pointer;color:var(--text2);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:all 0.15s;}
.nota-rapida:hover{border-color:var(--border2);color:var(--text);}
.avatar{width:34px;height:34px;border-radius:8px;background:rgba(201,168,76,0.15);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--gold);flex-shrink:0;}
.empty{text-align:center;padding:48px 20px;color:var(--text3);}
.empty-icon{font-size:40px;margin-bottom:12px;}
.empty-title{font-size:14px;font-weight:500;color:var(--text2);margin-bottom:4px;}
.info-bar{border-radius:var(--r);padding:10px 14px;font-size:12px;margin-bottom:14px;}
.info-bar.gold{background:rgba(201,168,76,0.08);border:1px solid rgba(201,168,76,0.2);color:var(--gold);}
.info-bar.blue{background:rgba(91,155,213,0.08);border:1px solid rgba(91,155,213,0.2);color:var(--blue);}
.info-bar.amber{background:rgba(212,146,58,0.1);border:1px solid rgba(212,146,58,0.25);color:var(--amber);display:flex;align-items:center;gap:8px;}
.nota-card{background:var(--bg2);border-radius:var(--r2);padding:14px 16px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start;}
.picker-drop{border:1px solid var(--border2);border-radius:var(--r2);background:var(--bg2);margin-top:6px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.3);}
.picker-item{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;font-size:12px;border-bottom:1px solid var(--border);}
.picker-item:hover{background:var(--bg3);}
.chart-bars{display:flex;align-items:flex-end;gap:5px;height:100px;padding:10px 14px 8px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end;}
.bar-fill{width:100%;border-radius:3px 3px 0 0;background:var(--bg4);min-height:4px;transition:background 0.2s;}
.bar-fill.active{background:var(--gold);}
.bar-fill:hover{background:var(--gold);}
.bar-lbl{font-size:9px;color:var(--text3);}
.distrib-item{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.distrib-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.chart-row{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:16px;}
.notif{position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:11px 16px;font-size:13px;z-index:999;transform:translateY(60px);opacity:0;transition:all 0.3s;box-shadow:0 8px 24px rgba(0,0,0,0.3);border-left:3px solid var(--green);}
.notif.show{transform:translateY(0);opacity:1;}
.notif.err{border-left-color:var(--red);}
.sync-indicator{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3);margin-left:auto;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.sync-dot.syncing{background:var(--amber);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
@media(max-width:900px){
  .sidebar{width:54px;}.sidebar .brand-text,.sidebar .nav-label,.sidebar .nav-text,.sidebar .nav-badge,.sidebar .user-info,.sidebar .brand-name,.sidebar .brand-sub{display:none;}
  .sidebar .nav-item{justify-content:center;}.main{margin-left:54px!important;}
  .metrics{grid-template-columns:1fr 1fr;}.chart-row{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}.mat-header,.mat-row{grid-template-columns:1fr 50px 70px 65px 60px 22px;}
}
@media(max-width:600px){
  .topbar{padding:12px 14px;}.content{padding:14px;}
  .metrics{grid-template-columns:1fr 1fr;}.metric-val{font-size:18px;}
}
</style>
</head>

// -- NOTIFY --
function notify(msg,err=false){const n=document.getElementById('notif');n.textContent=msg;n.className='notif'+(err?' err':'');n.classList.add('show');setTimeout(()=>n.classList.remove('show'),2800);}

// -- SYNC INDICATOR --
function setSyncing(v){const dot=document.getElementById('syncDot'),txt=document.getElementById('syncText');if(v){dot.className='sync-dot syncing';txt.textContent='Guardando...';}else{dot.className='sync-dot';txt.textContent='Sincronizado';}}

// -- FIRESTORE OPERATIONS --
async function saveDoc(colName,data){setSyncing(true);try{await col(colName).doc(data.id).set({...data,updatedAt:Date.now()},{merge:true});}catch(e){notify('Error al guardar',true);}setSyncing(false);}
async function softDel(colName,id){setSyncing(true);try{await col(colName).doc(id).update({deleted:true,updatedAt:Date.now()});}catch(e){notify('Error al eliminar',true);}setSyncing(false);}

// -- REALTIME LISTENERS --
function startListeners(){
  ['clientes','ordenes','gastos','catalogo','notas_banco'].forEach((c,i)=>{
    const key=['clientes','ordenes','gastos','catalogo','notasBanco'][i];
    const unsub=col(c).onSnapshot(snap=>{
      STATE[key]=snap.docs.map(d=>({id:d.id,...d.data()})).filter(d=>!d.deleted);
      updateBadges();
      // Re-render current page when relevant data changes
const pageMap={clientes:'clientes',ordenes:'ordenes',gastos:'gastos',catalogo:'catalogo',notas_banco:'notas'};
const shouldRender = pageMap[c]===STATE.page || (c==='ordenes' && (STATE.page==='ingresos'||STATE.page==='alertas'||STATE.page==='dashboard'));
if(shouldRender) renderPage(STATE.page);
    });
    unsubs.push(unsub);
  });
}

function updateBadges(){
  document.getElementById('nb-cli').textContent=STATE.clientes.length;
  document.getElementById('nb-ord').textContent=STATE.ordenes.length;
  const al=STATE.ordenes.filter(o=>{const s=(o.mo+o.mat+o.acarreo)-getTotalPagado(o);return s>0&&daysDiff(o.fechaIn)>7&&o.estado!=='entregado';});
  const ba=document.getElementById('nb-alert');ba.textContent=al.length;ba.style.display=al.length?'':'none';
}

// -- NAV --
function showPage(p){
  STATE.page=p;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.page===p));
  const labels={dashboard:'Dashboard',clientes:'Clientes',ordenes:'Órdenes',ingresos:'Ingresos',gastos:'Gastos',alertas:'Alertas',catalogo:'Catálogo de Materiales',notas:'Banco de Notas'};
  document.getElementById('page-title').textContent=labels[p]||p;
  renderPage(p);
}

document.querySelectorAll('.nav-item').forEach(el=>el.addEventListener('click',()=>showPage(el.dataset.page)));
document.addEventListener('click',function(e){
  // Close nombres suggestions
  const ndrop=document.getElementById('nombres-sug-drop');
  if(ndrop&&!ndrop.contains(e.target)&&e.target.id!=='mc-nom') ndrop.style.display='none';
  // Close mat picker
  const pdrop=document.getElementById('picker-drop');
  if(pdrop&&pdrop.innerHTML){
    const inside=pdrop.contains(e.target);
    const isMatInput=e.target.id&&e.target.id.startsWith('mat-inp-');
    const isDropBtn=e.target.closest&&e.target.closest('[onclick*="showPickerFiltered"]');
    if(!inside&&!isMatInput&&!isDropBtn) pdrop.innerHTML='';
  }
});

// -- SIDEBAR TOGGLE --
document.getElementById('toggleSidebar').addEventListener('click',()=>{
  STATE.sidebarOpen=!STATE.sidebarOpen;
  document.getElementById('sidebar').classList.toggle('collapsed',!STATE.sidebarOpen);
  document.getElementById('main').classList.toggle('collapsed',!STATE.sidebarOpen);
});

// -- MODAL --
function showModal(html){const r=document.getElementById('modal-root');r.innerHTML='<div class="overlay open" id="ov">'+html+'</div>';document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal();});}
function closeModal(){document.getElementById('modal-root').innerHTML='';}

// -- RENDER PAGE --
function renderPage(p){
  const c=document.getElementById('page-content');
  if(p==='dashboard')c.innerHTML=renderDashboard();
  else if(p==='clientes')c.innerHTML=renderClientes();
  else if(p==='ordenes')c.innerHTML=renderOrdenes();
  else if(p==='ingresos')c.innerHTML=renderIngresos();
  else if(p==='gastos')c.innerHTML=renderGastos();
  else if(p==='alertas')c.innerHTML=renderAlertas();
  else if(p==='catalogo')c.innerHTML=renderCatalogo();
  else if(p==='notas')c.innerHTML=renderNotas();
  bindEvents(p);
}

// -- DASHBOARD --
function renderDashboard(){
  const ordsM=filterByMonth(STATE.ordenes,STATE.mes);
  const gastsM=filterByMonth(STATE.gastos,STATE.mes,'fecha');
  const totalIng=ordsM.reduce((s,o)=>s+getTotalPagado(o),0);
  const totalGas=gastsM.reduce((s,g)=>s+g.monto,0);
  const porCobrar=ordsM.reduce((s,o)=>s+Math.max(0,(o.mo+o.mat+o.acarreo)-getTotalPagado(o)),0);
  const gan=totalIng-totalGas;
  const now=new Date();const bars=[];let maxV=0;
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const ym=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');const ing=filterByMonth(STATE.ordenes,ym).reduce((s,o)=>s+getTotalPagado(o),0);if(ing>maxV)maxV=ing;bars.push({l:MESES[d.getMonth()].slice(0,3),v:ing,cur:ym===STATE.mes});}
  const rec=[...STATE.ordenes].sort((a,b)=>String(b.id).localeCompare(String(a.id))).slice(0,5);
  const selMes=monthOpts().map(o=>`<option value="${o.v}"${o.v===STATE.mes?' selected':''}>${o.l}</option>`).join('');
  return `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px">
    <div></div><select id="dash-mes" style="width:auto">${selMes}</select>
  </div>
  <div class="metrics">
    <div class="metric"><div class="metric-label">Ingresos del mes</div><div class="metric-val" style="color:var(--gold)">${fmt(totalIng)}</div><div class="metric-sub">${ordsM.length} órdenes</div></div>
    <div class="metric"><div class="metric-label">Ganancia neta</div><div class="metric-val" style="color:${gan>=0?'var(--green)':'var(--red)'}">${fmt(gan)}</div><div class="metric-sub">${gan>=0?'Positivo':'Negativo'}</div></div>
    <div class="metric"><div class="metric-label">Por cobrar</div><div class="metric-val" style="color:var(--blue)">${fmt(porCobrar)}</div><div class="metric-sub">saldo pendiente</div></div>
    <div class="metric"><div class="metric-label">Gastos del mes</div><div class="metric-val" style="color:var(--red)">${fmt(totalGas)}</div><div class="metric-sub">${gastsM.length} registros</div></div>
  </div>
  <div class="chart-row">
    <div class="card"><div class="card-header"><span class="card-title">Ingresos por mes</span></div>
      <div class="chart-bars">${bars.map(b=>`<div class="bar-col"><div class="bar-fill${b.cur?' active':''}" style="height:${maxV>0?Math.max(5,(b.v/maxV*100))+'%':'5px'}" title="${fmt(b.v)}"></div><div class="bar-lbl">${b.l}</div></div>`).join('')}</div></div>
    <div class="card"><div class="card-header"><span class="card-title">Distribución</span></div>
      <div style="padding:14px">${[{l:'Mano de obra',v:ordsM.reduce((s,o)=>s+o.mo,0),c:'var(--gold)'},{l:'Materiales',v:ordsM.reduce((s,o)=>s+o.mat,0),c:'var(--blue)'},{l:'Acarreo',v:ordsM.reduce((s,o)=>s+o.acarreo,0),c:'var(--green)'}].map(x=>`<div class="distrib-item"><div class="distrib-dot" style="background:${x.c}"></div><span style="font-size:12px;color:var(--text2);flex:1">${x.l}</span><span style="font-size:12px;font-weight:500">${fmt(x.v)}</span></div>`).join('')}</div></div>
  </div>
  <div class="card"><div class="card-header"><span class="card-title">Últimas órdenes</span><button class="btn btn-sm" onclick="showPage('ordenes')">Ver todas</button></div>
    <div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Trabajo</th><th>Total</th><th>Pagado</th><th>Estado</th></tr></thead><tbody>
    ${rec.length?rec.map(o=>{const total=o.mo+o.mat+o.acarreo,pagado=getTotalPagado(o);return`<tr><td>${getClienteNombre(o)}</td><td style="max-width:200px;color:var(--text2);font-size:12px"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px">${o.desc}</div></td><td style="color:var(--gold);font-weight:500">${fmt(total)}</td><td style="color:${pagado>=total?'var(--green)':'var(--amber)'}">${fmt(pagado)}</td><td>${estadoBadge(o.estado)}</td></tr>`;}).join(''):'<tr><td colspan="5" style="text-align:center;color:var(--text3);padding:30px">Sin órdenes aún</td></tr>'}
    </tbody></table></div></div>`;
}

function estadoBadge(e){const m={pendiente:'badge-amber',proceso:'badge-blue',listo:'badge-green',entregado:'badge-gray'};const l={pendiente:'Pendiente',proceso:'En proceso',listo:'Listo',entregado:'Entregado'};return`<span class="badge ${m[e]||'badge-gray'}">${l[e]||e}</span>`;}

async function saveCliente(id){
  const nom=document.getElementById('c-nom').value.trim();
  if(!nom){notify('El nombre es obligatorio',true);return;}
  const obj={id:id||uid(),nombre:nom,tel:document.getElementById('c-tel').value,email:document.getElementById('c-email').value,cedula:document.getElementById('c-ced').value,dir:document.getElementById('c-dir').value,notas:document.getElementById('c-notas').value,fechaReg:STATE.clientes.find(x=>x.id===id)?.fechaReg||today()};
  await saveDoc('clientes',obj);closeModal();notify('Cliente guardado');
}

  // Load materiales and pagos safely
  tempMats=[];
  tempPagos=[];

    try{
      var rawMats=o.materiales;
      if(typeof rawMats==='string'&&rawMats){rawMats=JSON.parse(rawMats);}
      if(Array.isArray(rawMats)){
        tempMats=rawMats.map(function(m){
          return{nombre:String(m.nombre||''),cant:parseFloat(m.cant)||0,unidad:String(m.unidad||''),precio:parseFloat(m.precio)||0};
        }).filter(function(m){return m.nombre;});
      }
    }catch(e){console.error('mat load err',e);tempMats=[];}
    try{
      var rawPagos=o.pagos;
      if(typeof rawPagos==='string'&&rawPagos){rawPagos=JSON.parse(rawPagos);}
      if(Array.isArray(rawPagos)){
        tempPagos=rawPagos.map(function(p){return{tipo:String(p.tipo||'efectivo'),monto:parseFloat(p.monto)||0};}).filter(function(p){return p.monto>0;});
      }
    }catch(e){console.error('pago load err',e);tempPagos=[];}
  }
  const selCli=o?o.clienteId:(clienteId||'');
  const cliOpts=`<option value="">Seleccionar...</option><option value="anonimo"${selCli==='anonimo'?' selected':''}>👤 Anónimo</option>`+STATE.clientes.map(c=>`<option value="${c.id}"${c.id===selCli?' selected':''}>${c.nombre}</option>`).join('');
  const tipoOpts=TIPOS.map(t=>`<option${o&&o.tipo===t?' selected':''}>${t}</option>`).join('');
  const estOpts=ESTADOS.map(e=>`<option value="${e}"${o&&o.estado===e?' selected':''}>${e}</option>`).join('');
  const priOpts=[['normal','Normal'],['urgente','⚡ Urgente'],['baja','Baja']].map(([v,l])=>`<option value="${v}"${o&&o.prioridad===v?' selected':''}>${l}</option>`).join('');
  const notasDisp=[...NOTAS_RAPIDAS,...STATE.notasBanco.map(n=>n.texto).filter(t=>!NOTAS_RAPIDAS.includes(t))];
  showModal(`<div class="modal"><div class="modal-header"><span class="modal-title">${id?'Editar orden':'Nueva orden'}</span><button class="modal-close" onclick="closeModal()">×</button></div>
  <div class="modal-body">
    <div class="form-grid">
      <div class="form-group"><label class="form-label">Cliente *</label>

function appendNota(t){const ta=document.getElementById('o-notas');if(ta)ta.value=ta.value?(ta.value+(ta.value.endsWith('\n')?'':'\n')+t):t;}

function matTotalCalc(){return tempMats.reduce((s,m)=>s+((parseFloat(m.cant)||0)*(parseFloat(m.precio)||0)),0);}
function updatePresup(){
  const mo=parseFloat(document.getElementById('o-mo')?.value)||0;
  const mat=matTotalCalc();
  const ac=parseFloat(document.getElementById('o-acarreo')?.value)||0;
  const tot=mo+mat+ac;
  const om=document.getElementById('o-mat');if(om)om.value=mat.toFixed(2);
  const td=document.getElementById('o-total-disp');if(td)td.textContent=fmt(tot);
  const mtd=document.getElementById('mat-total-disp');if(mtd)mtd.textContent=fmt(mat);
  const pagado=tempPagos.reduce((s,p)=>s+(parseFloat(p.monto)||0),0);
  const saldo=tot-pagado;
  const sd=document.getElementById('o-saldo-disp');if(sd){sd.textContent=fmt(Math.abs(saldo));sd.style.color=saldo<=0?'var(--green)':'var(--red)';}
}

function renderMatRows(){
  var c=document.getElementById('mat-rows');if(!c)return;
  c.innerHTML='';
  for(var i=0;i<tempMats.length;i++){
    var m=tempMats[i];
    var uOpts=UNIDADES.map(function(u){return'<option'+(m.unidad===u?' selected':'')+'>'+u+'</option>';}).join('');
    var sub=fmt((parseFloat(m.cant)||0)*(parseFloat(m.precio)||0));
    var row=document.createElement('div');
    row.className='mat-row';
    row.innerHTML='<div style="position:relative">'
      +'<input id="mat-inp-'+i+'" value="'+(m.nombre||'')+'" placeholder="Escribe o selecciona..." autocomplete="off" style="padding-right:24px">'
      +'<button data-picker-idx="'+i+'" class="mat-picker-btn" style="position:absolute;right:5px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:11px">&#9660;</button>'
      +'</div>'
      +'<input type="number" value="'+(m.cant!=null&&m.cant!==''?m.cant:'')+'" placeholder="0" data-mat-cant="'+i+'">'
      +'<select data-mat-uni="'+i+'">'+uOpts+'</select>'
      +'<input type="number" value="'+(m.precio!=null&&m.precio!==0&&m.precio!==''?m.precio:'')+'" placeholder="0" data-mat-pre="'+i+'">'
      +'<span class="mat-sub" id="mat-sub-'+i+'">'+sub+'</span>'
      +'<button data-mat-del="'+i+'" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px">&#10005;</button>';
    // Bind events
    var inp=row.querySelector('#mat-inp-'+i);
    inp.addEventListener('input',function(){tempMats[i].nombre=this.value;showPickerFiltered(i,this.value);});
    inp.addEventListener('focus',function(){showPickerFiltered(i,this.value);});
    inp.addEventListener('keydown',function(e){if(e.key==='Escape'){var pd=document.getElementById('picker-drop');if(pd)pd.innerHTML='';}});
    row.querySelector('.mat-picker-btn').addEventListener('click',function(){showPickerFiltered(i,inp.value);});
    (function(idx){
      row.querySelector('[data-mat-cant]').addEventListener('input',function(){
        tempMats[idx].cant=this.value;
        var s=(parseFloat(tempMats[idx].cant)||0)*(parseFloat(tempMats[idx].precio)||0);
        var el=document.getElementById('mat-sub-'+idx);if(el)el.textContent=fmt(s);
        updatePresup();
      });
      row.querySelector('[data-mat-uni]').addEventListener('change',function(){tempMats[idx].unidad=this.value;});
      row.querySelector('[data-mat-pre]').addEventListener('input',function(){
        tempMats[idx].precio=this.value;
        var s=(parseFloat(tempMats[idx].cant)||0)*(parseFloat(tempMats[idx].precio)||0);
        var el=document.getElementById('mat-sub-'+idx);if(el)el.textContent=fmt(s);
        updatePresup();
      });
      row.querySelector('[data-mat-del]').addEventListener('click',function(){
        tempMats.splice(idx,1);renderMatRows();updatePresup();
      });
    })(i);
        c.appendChild(row);
  }
  updatePresup();
}

function updateMatSubtotal(i){
  tempMats[i].cant=document.querySelector(`#mat-rows .mat-row:nth-child(${i+1}) input[type=number]:first-of-type`)?.value||tempMats[i].cant;
  tempMats[i].precio=document.querySelector(`#mat-rows .mat-row:nth-child(${i+1}) input[type=number]:last-of-type`)?.value||tempMats[i].precio;

var currentPickerIdx=null;

function showPickerFiltered(idx,q){
  var pd=document.getElementById('picker-drop');if(!pd)return;
  var filt=(STATE.catalogo||[]).filter(function(c){return !q||c.nombre.toLowerCase().includes(q.toLowerCase());});

      rows+='<div class="picker-item" data-catid="'+c.id+'" style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:13px">'+c.nombre+'</div>'+sub+'</div></div>';
    });
  } else {
    rows='<div style="padding:10px 12px;font-size:12px;color:#6a6862">No hay materiales en el catalogo.</div>';
  }
  pd.innerHTML='<div class="picker-drop">'
    +'<div style="padding:7px 12px;border-bottom:1px solid #3a3935;display:flex;justify-content:space-between;align-items:center">'
    +'<span style="font-size:11px;font-weight:500;color:#9e9b93;text-transform:uppercase;letter-spacing:0.07em">Catalogo</span>'
    +'<button id="btn-close-picker" style="background:none;border:none;color:#6a6862;cursor:pointer;font-size:16px;line-height:1">x</button>'
    +'</div>'
    +'<div style="max-height:200px;overflow-y:auto" id="picker-items">'+rows+'</div>'
    +'<div style="padding:6px 10px;border-top:1px solid #3a3935">'
    +'<button id="btn-picker-go-cat" class="btn btn-sm" style="width:100%;justify-content:center;font-size:11px">+ Agregar nuevo al catalogo</button>'
    +'</div></div>';
  var closeBtn=pd.querySelector('#btn-close-picker');
  if(closeBtn) closeBtn.addEventListener('click',function(){pd.innerHTML='';});
  var goBtn=pd.querySelector('#btn-picker-go-cat');
  if(goBtn) goBtn.addEventListener('click',function(){pd.innerHTML='';showPage('catalogo');});
  pd.querySelectorAll('.picker-item').forEach(function(el){
    el.addEventListener('mouseenter',function(){el.style.background='#252420';});
    el.addEventListener('mouseleave',function(){el.style.background='';});
    el.addEventListener('click',function(){selMatFromPicker(idx,el.dataset.catid);});
  });
}
function selMatFromPicker(idx,catId){
  const cat=STATE.catalogo.find(x=>x.id===catId);if(!cat)return;
  tempMats[idx]={...tempMats[idx],nombre:cat.nombre};
  if(cat.unidad) tempMats[idx].unidad=cat.unidad;
  if(cat.precio) tempMats[idx].precio=String(cat.precio);
  document.getElementById('picker-drop').innerHTML='';
  renderMatRows();updatePresup();
  // Focus cant field after selection
  setTimeout(()=>{
    const rows=document.querySelectorAll('#mat-rows .mat-row');
    if(rows[idx]){const numInp=rows[idx].querySelectorAll('input[type=number]');if(numInp[0])numInp[0].focus();}
  },50);
}

  const mat=matTotalCalc();const ac=parseFloat(document.getElementById('o-acarreo').value)||0;
  const obj={id:id||uid(),clienteId:cv,desc,tipo:document.getElementById('o-tipo').value,estado:document.getElementById('o-est').value,prioridad:document.getElementById('o-pri').value,fechaIn:document.getElementById('o-fin').value,fechaOut:document.getElementById('o-fout').value,mo,mat,acarreo:ac,notas:document.getElementById('o-notas').value,pagos:JSON.stringify(tempPagos.filter(function(p){return parseFloat(p.monto)>0;}).map(function(p){return{tipo:p.tipo,monto:parseFloat(p.monto)||0};})),materiales:JSON.stringify(tempMats.filter(function(m){return m.nombre;}).map(function(m){return{nombre:m.nombre,cant:parseFloat(m.cant)||0,unidad:m.unidad||'',precio:parseFloat(m.precio)||0};})),fechaReg:STATE.ordenes.find(x=>x.id===id)?.fechaReg||today()};
  await saveDoc('ordenes',obj);closeModal();notify('Orden guardada');
}

  ${ords.length?ords.map(o=>{let oef=0,otar=0,otr=0;(o.pagos||[]).forEach(p=>{if(p.tipo==='efectivo')oef+=p.monto;else if(p.tipo==='tarjeta')otar+=p.monto;else otr+=p.monto;});const pagado=oef+otar+otr,total=o.mo+o.mat+o.acarreo,saldo=total-pagado;return`<tr><td style="font-size:11px;color:var(--text3)">${fmtD(o.fechaIn||o.fechaReg)}</td><td style="font-size:11px;color:var(--text3)">${o.id.slice(-5)}</td><td>${getClienteNombre(o)}</td><td>${oef>0?fmt(oef):'--'}</td><td>${otar>0?fmt(otar):'--'}</td><td>${otr>0?fmt(otr):'--'}</td><td style="color:var(--gold);font-weight:500">${fmt(pagado)}</td><td style="color:${saldo>0?'var(--red)':'var(--green)'}">${saldo>0?fmt(saldo):'Saldado'}</td></tr>`;}).join(''):'<tr><td colspan="8" style="text-align:center;color:var(--text3);padding:30px">Sin ingresos en este período</td></tr>'}

function renderCatalogo(){
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div></div><button class="btn btn-gold" onclick="openModalCat(null)">+ Nuevo material</button></div>
  <div class="info-bar gold" style="margin-bottom:14px">Al crear órdenes, haz clic en la casilla de material para seleccionar del catálogo.</div>
  <div class="card"><div class="table-wrap"><table><thead><tr><th>Material</th><th>Unidad</th><th>Precio ref.</th><th>Acciones</th></tr></thead><tbody>
  ${STATE.catalogo.length?STATE.catalogo.map(m=>`<tr><td><strong>${m.nombre}</strong></td><td style="color:var(--text2)">${m.unidad||'--'}</td><td style="color:var(--gold)">${m.precio?fmt(m.precio):'--'}</td><td><div style="display:flex;gap:4px"><button class="btn btn-sm" onclick="openModalCat('${m.id}')">Editar</button><button class="btn btn-sm btn-danger" onclick="delCat('${m.id}')">Eliminar</button></div></td></tr>`).join(''):'<tr><td colspan="4"><div class="empty"><div class="empty-icon">📦</div><div class="empty-title">Sin materiales</div><p>Agrega los materiales que usas en el taller</p></div></td></tr>'}
  </tbody></table></div></div>`;
}
function openModalCat(id){
  const m=id?STATE.catalogo.find(x=>x.id===id):{};
  const uOpts=UNIDADES.map(u=>`<option${m.unidad===u?' selected':''}>${u}</option>`).join('');
  showModal(`<div class="modal modal-sm"><div class="modal-header"><span class="modal-title">${id?'Editar material':'Nuevo material'}</span><button class="modal-close" onclick="closeModal()">×</button></div>
  <div class="modal-body"><div class="form-grid">
    <div class="form-group full">
      <label class="form-label">Nombre *</label>
      <div style="position:relative">
        <input id="mc-nom" value="${m.nombre||''}" placeholder="Escribe o selecciona..." autocomplete="off" oninput="filterNombresSug(this.value)" onfocus="showNombresSug()">
        <div id="nombres-sug-drop" style="display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);max-height:180px;overflow-y:auto;z-index:10;box-shadow:0 6px 20px rgba(0,0,0,0.3)"></div>
      </div>
      <div style="margin-top:6px;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3)">
        <span>Sugerencias:</span>
        <button class="btn btn-sm" onclick="openGestionNombres()" style="font-size:10px;padding:2px 8px">✏️ Gestionar</button>
      </div>
    </div>
    <div class="form-group"><label class="form-label">Unidad</label><select id="mc-uni"><option value="">Sin unidad</option>${uOpts}</select></div>
    <div class="form-group"><label class="form-label">Precio referencia</label><input type="number" id="mc-pre" value="${m.precio||''}"></div>
  </div></div>
  <div class="modal-footer"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" onclick="saveCat('${id||''}')">Guardar</button></div>
  </div>`);
  renderNombresSug('');
}

function getNombresSug(){
  const saved=localStorage.getItem('tapix_nombres_mat');
  if(saved) return JSON.parse(saved);
  const defaults=['Tela de vinilo', 'Tela de tela', 'Espuma #40', 'Espuma #60', 'Espuma #80', 'Colcha de espuma', 'Grapa de aire', 'Grapa manual', 'Pata de madera', 'Pata de metal', 'Nosal', 'Hilo', 'Pegamento', 'Tela impermeable', 'Foam', 'Resorte', 'Cinta de borde', 'Cremallera', 'Relleno de fibra', 'Madera terciada', 'Tornillo', 'Tela mosquitero'];
  localStorage.setItem('tapix_nombres_mat',JSON.stringify(defaults));
  return defaults;
}
function saveNombresSug(list){ localStorage.setItem('tapix_nombres_mat',JSON.stringify(list)); }

function renderNombresSug(q){
  const drop=document.getElementById('nombres-sug-drop');if(!drop)return;
  const list=getNombresSug().filter(n=>!q||n.toLowerCase().includes(q.toLowerCase()));
  if(!list.length){drop.style.display='none';return;}
  drop.style.display='block';
  drop.innerHTML=list.map(n=>`<div onclick="selNombreSug('${n.replace(/'/g,"\'")}');document.getElementById('nombres-sug-drop').style.display='none'" style="padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)" onmouseover="this.style.background='var(--bg3)'" onmouseout="this.style.background=''">${n}</div>`).join('');
}
function filterNombresSug(q){ renderNombresSug(q); }
function showNombresSug(){ renderNombresSug(document.getElementById('mc-nom')?.value||''); }
function selNombreSug(n){ const inp=document.getElementById('mc-nom');if(inp)inp.value=n; }

function openGestionNombres(){
  closeModal();
  const list=getNombresSug();
  showModal(`<div class="modal modal-sm"><div class="modal-header"><span class="modal-title">Gestionar sugerencias de nombres</span><button class="modal-close" onclick="closeModal();openModalCat(null)">×</button></div>
  <div class="modal-body">
    <p style="font-size:12px;color:var(--text2);margin-bottom:12px">Estos nombres aparecerán como sugerencias al agregar materiales al catálogo.</p>
    <div id="nombres-list">${renderNombresList(list)}</div>
    <div style="display:flex;gap:7px;margin-top:10px">
      <input id="nuevo-nombre-sug" placeholder="Nuevo nombre..." style="flex:1">
      <button class="btn btn-gold" onclick="addNombreSug()">+ Agregar</button>
    </div>
  </div>
  <div class="modal-footer"><button class="btn btn-gold" onclick="closeModal();openModalCat(null)">Listo</button></div>
  </div>`);
}
function renderNombresList(list){
  return list.map((n,i)=>`<div style="display:flex;align-items:center;gap:7px;background:var(--bg3);border-radius:var(--r);padding:7px 10px;margin-bottom:5px"><span style="flex:1;font-size:13px">${n}</span><button class="btn btn-sm btn-danger" onclick="delNombreSug(${i})">✕</button></div>`).join('');
}
function addNombreSug(){
  const inp=document.getElementById('nuevo-nombre-sug');if(!inp)return;
  const val=inp.value.trim();if(!val){notify('Escribe un nombre',true);return;}
  const list=getNombresSug();list.push(val);saveNombresSug(list);
  inp.value='';document.getElementById('nombres-list').innerHTML=renderNombresList(list);
  notify('Nombre agregado');
}
function delNombreSug(i){
  const list=getNombresSug();list.splice(i,1);saveNombresSug(list);
  document.getElementById('nombres-list').innerHTML=renderNombresList(list);
}
async function saveCat(id){
  const nom=document.getElementById('mc-nom').value.trim();
  if(!nom){notify('El nombre es obligatorio',true);return;}
  await saveDoc('catalogo',{id:id||uid(),nombre:nom,unidad:document.getElementById('mc-uni').value,precio:parseFloat(document.getElementById('mc-pre').value)||0});
  closeModal();notify('Material guardado');
}
async function delCat(id){if(!confirm('¿Eliminar?'))return;await softDel('catalogo',id);notify('Eliminado');}

// -- NOTAS BANCO --
function renderNotas(){
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div></div><button class="btn btn-gold" onclick="openModalNota(null)">+ Nueva nota</button></div>
  <div class="info-bar blue">Las notas marcadas como automáticas aparecerán pre-llenadas en cada nueva orden.</div>
  ${STATE.notasBanco.length?STATE.notasBanco.map(n=>`<div class="nota-card" style="border:1px solid ${n.auto?'rgba(201,168,76,0.4)':'var(--border)'}"><div style="flex:1"><p style="font-size:13px;line-height:1.6;margin-bottom:9px">${n.texto}</p><label style="display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12px;color:${n.auto?'var(--gold)':'var(--text3)'}"><input type="checkbox" ${n.auto?'checked':''} onchange="toggleNota('${n.id}',this.checked)" style="accent-color:var(--gold);width:14px;height:14px">${n.auto?'Se agrega automáticamente':'Agregar automáticamente'}</label></div><div style="display:flex;gap:5px;flex-shrink:0"><button class="btn btn-sm" onclick="openModalNota('${n.id}')">Editar</button><button class="btn btn-sm btn-danger" onclick="delNota('${n.id}')">Eliminar</button></div></div>`).join(''):'<div class="empty"><div class="empty-icon">📝</div><div class="empty-title">Sin notas</div><p>Crea notas reutilizables para tus órdenes</p></div>'}`;
}
function openModalNota(id){
  const n=id?STATE.notasBanco.find(x=>x.id===id):{};
  showModal(`<div class="modal modal-sm"><div class="modal-header"><span class="modal-title">${id?'Editar nota':'Nueva nota'}</span><button class="modal-close" onclick="closeModal()">×</button></div>
  <div class="modal-body">
    <div class="form-group" style="margin-bottom:13px"><label class="form-label">Texto de la nota</label><textarea id="nb-texto" rows="4">${n.texto||''}</textarea></div>
    <label style="display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13px"><input type="checkbox" id="nb-auto" ${n.auto?'checked':''} style="accent-color:var(--gold);width:15px;height:15px">Agregar automáticamente en cada nueva orden</label>
  </div>
  <div class="modal-footer"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" onclick="saveNota('${id||''}')">Guardar</button></div>
  </div>`);
}
async function saveNota(id){
  const texto=document.getElementById('nb-texto').value.trim();
  if(!texto){notify('Escribe el texto',true);return;}
  await saveDoc('notas_banco',{id:id||uid(),texto,auto:document.getElementById('nb-auto').checked});
  closeModal();notify('Nota guardada');
}
async function delNota(id){if(!confirm('¿Eliminar?'))return;await softDel('notas_banco',id);notify('Eliminado');}
async function toggleNota(id,auto){
  const n=STATE.notasBanco.find(x=>x.id===id);if(!n)return;
  await saveDoc('notas_banco',{...n,auto});
}

// -- BIND EVENTS --
function bindEvents(p){
  if(p==='dashboard'){const ms=document.getElementById('dash-mes');if(ms)ms.addEventListener('change',e=>{STATE.mes=e.target.value;renderPage('dashboard');});}
  if(p==='ingresos'){const mi=document.getElementById('ing-mes');if(mi)mi.addEventListener('change',e=>{STATE.mesIng=e.target.value;renderPage('ingresos');});}
  if(p==='gastos'){const mg=document.getElementById('gas-mes');if(mg)mg.addEventListener('change',e=>{STATE.mesGas=e.target.value;renderPage('gastos');});}
}

// -- AUTH --
document.getElementById('btnGoogle').addEventListener('click',()=>{
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>notify('Error al iniciar sesión: '+e.message,true));
});

// -- IMPRIMIR FACTURA --
function imprimirFactura(id){
  var o=STATE.ordenes.find(function(x){return x.id===id;});
  if(!o){notify("Orden no encontrada",true);return;}
  var c=o.clienteId==="anonimo"
    ?{nombre:"Anonimo",tel:"",dir:""}
    :(STATE.clientes.find(function(x){return x.id===o.clienteId;})||{nombre:"--",tel:"",dir:""});
  var moMat=(o.mo||0)+(o.mat||0);
  var total=moMat+(o.acarreo||0);
  var pagado=getTotalPagado(o);
  var saldo=total-pagado;

  // Pagos
  var pagosHTML="";
  (o.pagos||[]).forEach(function(p){
    pagosHTML+="<tr><td style='padding:5px 0;border-bottom:1px solid #f0e8d8'>"+p.tipo.charAt(0).toUpperCase()+p.tipo.slice(1)+"</td>"
      +"<td style='padding:5px 0;border-bottom:1px solid #f0e8d8;text-align:right'>RD$"+Number(p.monto).toLocaleString("es-DO")+"</td></tr>";
  });

  // Materiales
  var matsHTML="";
  if((o.materiales||[]).length){
    matsHTML+="<p style='font-size:11px;color:#8B6914;text-transform:uppercase;letter-spacing:1px;margin:14px 0 6px;font-family:Arial'>Materiales utilizados</p>";
    matsHTML+="<table style='width:100%;border-collapse:collapse;font-size:12px'>"
      +"<tr style='border-bottom:2px solid #e8c97a'><td style='padding:4px 0;font-weight:bold'>Material</td>"
      +"<td style='padding:4px 0;font-weight:bold;text-align:center'>Cant.</td>"
      +"<td style='padding:4px 0;font-weight:bold;text-align:center'>Unidad</td>"
      +"<td style='padding:4px 0;font-weight:bold;text-align:right'>Precio</td>"
      +"<td style='padding:4px 0;font-weight:bold;text-align:right'>Subtotal</td></tr>";
    (o.materiales||[]).forEach(function(m){
      var sub=m.cant&&m.precio?"RD$"+Number(m.cant*m.precio).toLocaleString("es-DO"):"--";
      var pre=m.precio?"RD$"+Number(m.precio).toLocaleString("es-DO"):"--";
      matsHTML+="<tr>"
        +"<td style='padding:4px 0;border-bottom:1px solid #f5ead8'>"+m.nombre+"</td>"
        +"<td style='padding:4px 0;border-bottom:1px solid #f5ead8;text-align:center'>"+(m.cant||"")+"</td>"
        +"<td style='padding:4px 0;border-bottom:1px solid #f5ead8;text-align:center'>"+(m.unidad||"")+"</td>"
        +"<td style='padding:4px 0;border-bottom:1px solid #f5ead8;text-align:right'>"+pre+"</td>"
        +"<td style='padding:4px 0;border-bottom:1px solid #f5ead8;text-align:right'>"+sub+"</td></tr>";
    });
    matsHTML+="</table>";
  }

  var saldoBox=saldo>0
    ?"<div style='background:#fff8e6;border:1px solid #e8c97a;border-radius:6px;padding:10px 14px;margin-top:12px'>"
      +"<span style='font-size:13px;color:#7a5800'>Saldo pendiente: <strong>RD$"+Number(saldo).toLocaleString("es-DO")+"</strong></span></div>"
    :"<div style='background:#eaf7ee;border:1px solid #5cb87a;border-radius:6px;padding:10px 14px;margin-top:12px'>"
      +"<span style='font-size:13px;color:#2d6e41'>&#10003; Orden saldada completamente</span></div>";

  var notasBox=o.notas
    ?"<p style='font-size:12px;color:#7a6040;font-style:italic;margin-top:10px;padding-top:10px;border-top:1px solid #d4a84c'>Notas: "+o.notas+"</p>"
    :"";

  var css=""
    +"body{font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;color:#3a2e1a;max-width:500px;margin:0 auto;padding:30px;}"
    +"h2{font-size:13px;color:#8B6914;text-transform:uppercase;letter-spacing:1px;margin:14px 0 6px;border-bottom:1px solid #d4a84c;padding-bottom:4px;}"
    +"table{width:100%;border-collapse:collapse;font-size:13px;}"
    +"td,th{padding:6px 4px;vertical-align:top;}"
    +".divider{border:none;border-top:1px solid #d4a84c;margin:12px 0;}"
    +".divider2{border:none;border-top:3px double #c9a84c;margin:12px 0;}"
    +".label{color:#8B6914;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;}"
    +".total-row td{font-weight:bold;font-size:16px;border-top:2px solid #c9a84c;padding-top:10px;color:#6B4F0A;}"
    +".cost-row td{border-bottom:1px solid #f5ead8;padding:7px 4px;}"
    +".footer{font-size:10px;color:#bba060;text-align:center;margin-top:24px;letter-spacing:1px;}"
    +"@media print{.no-print{display:none!important}}";

  var H="<!DOCTYPE html><html><head><meta charset=UTF-8>"
    +"<title>Factura #"+o.id.slice(-6)+" - Tapixcalidad</title>"
    +"<style>"+css+"</style></head><body>"

    // Logo y encabezado
    +"<div style='text-align:center;margin-bottom:14px'>"
    +"<img src=''+document.getElementById('tapix-logo').src+'' style='width:180px;max-width:100%' alt='Tapixcalidad'></div>"
    +"<div style='text-align:center;font-size:10px;color:#a07830;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px'>"
    +"tapiceria &nbsp;&middot;&nbsp; acarreo &nbsp;&middot;&nbsp; calidad</div>"
    +"<hr class='divider2'>"

    // Info factura y cliente en dos columnas
    +"<table style='margin-bottom:6px'><tr>"
    +"<td style='width:60%;vertical-align:top'>"
    +"<p class='label'>Cliente</p>"
    +"<p style='font-size:15px;font-weight:bold;margin:0 0 3px'>"+c.nombre+"</p>"
    +(c.tel?"<p style='margin:0;color:#666'>Tel: "+c.tel+"</p>":"")
    +(c.dir?"<p style='margin:0;color:#666'>"+c.dir+"</p>":"")
    +"</td>"
    +"<td style='text-align:right;vertical-align:top'>"
    +"<p class='label'>Factura #</p>"
    +"<p style='font-size:15px;font-weight:bold;margin:0 0 6px'>"+o.id.slice(-6)+"</p>"
    +"<p class='label'>Fecha de creacion</p>"
    +"<p style='margin:0 0 6px'>"+fmtD(o.fechaIn)+"</p>"
    +(o.fechaOut?"<p class='label'>Fecha de entrega</p><p style='margin:0'>"+fmtD(o.fechaOut)+"</p>":"")
    +"<p class='label' style='margin-top:6px'>Estado</p>"
    +"<p style='margin:0;font-weight:bold'>"+o.estado.charAt(0).toUpperCase()+o.estado.slice(1)+"</p>"
    +"</td></tr></table>"

    +"<hr class='divider'>"
    +"<h2>Descripcion del trabajo</h2>"
    +"<p style='margin:0 0 4px;color:#6B4F0A;font-style:italic'>"+o.tipo+"</p>"
    +"<p style='margin:0'>"+o.desc+"</p>"
    +matsHTML

    +"<hr class='divider'>"
    +"<h2>Desglose del costo</h2>"
    +"<table><tr class='cost-row'>"
    +"<td>Servicio (mano de obra + materiales)</td>"
    +"<td style='text-align:right;font-weight:bold'>RD$"+Number(moMat).toLocaleString("es-DO")+"</td></tr>"
    +"<tr class='cost-row'>"
    +"<td>Acarreo</td>"
    +"<td style='text-align:right'>RD$"+Number(o.acarreo||0).toLocaleString("es-DO")+"</td></tr>"
    +"<tr class='total-row'>"
    +"<td>TOTAL</td>"
    +"<td style='text-align:right'>RD$"+Number(total).toLocaleString("es-DO")+"</td></tr></table>"

    +(pagosHTML
      ?"<hr class='divider'><h2>Pagos recibidos</h2><table>"+pagosHTML+"</table>"
      :"")
    +saldoBox
    +notasBox
    +"<hr class='divider'>"
    +"<p class='footer'>Gracias por su preferencia &nbsp;&middot;&nbsp; TAPIXCALIDAD</p>"
    +"<button class='no-print' onclick='window.print()' "
    +"style='width:100%;padding:12px;background:#c9a84c;border:none;border-radius:8px;"
    +"font-size:14px;font-weight:bold;cursor:pointer;color:#3a2e1a;font-family:Arial;margin-top:12px'>"
    +"Imprimir / Guardar como PDF</button>"
    +"</body></html>";

  var win=window.open("","_blank","width=540,height=800");
  if(win){win.document.write(H);win.document.close();}
  else notify("Permite ventanas emergentes para imprimir",true);
}

// -- CONTACT PICKER --
async function pickContact(){
  if(!('contacts' in navigator&&'ContactsManager' in window)){
    notify('Disponible solo en Chrome para Android.',true);return;
  }
  try{
    var contacts=await navigator.contacts.select(['name','tel'],{multiple:false});
    if(!contacts||!contacts.length)return;
    var c=contacts[0];
    var name=(c.name&&c.name[0])||'';
    var tel=(c.tel&&c.tel[0])||'';
    var n=document.getElementById('c-nom');var t=document.getElementById('c-tel');
    if(n&&name)n.value=name;
    if(t&&tel)t.value=tel;
    notify('Contacto importado');
  }catch(e){if(e.name!=='AbortError')notify('Error al acceder a contactos',true);}
}

async function pickContactForOrden(){
  if(!('contacts' in navigator&&'ContactsManager' in window)){
    notify('Disponible solo en Chrome para Android.',true);return;
  }
  try{
    var contacts=await navigator.contacts.select(['name','tel'],{multiple:false});
    if(!contacts||!contacts.length)return;
    var c=contacts[0];
    var name=(c.name&&c.name[0])||'';
    var tel=(c.tel&&c.tel[0])||'';
    if(!name){notify('No se encontro nombre',true);return;}
    var existing=STATE.clientes.find(function(x){return x.nombre.toLowerCase()===name.toLowerCase()||(tel&&x.tel===tel);});
    if(existing){
      var sel=document.getElementById('o-cli');
      if(sel)sel.value=existing.id;
      notify('Cliente: '+existing.nombre);return;
    }
    if(confirm('No encontre a "'+name+'" en clientes. Agregar como nuevo?')){
      var newId=uid();
      await saveDoc('clientes',{id:newId,nombre:name,tel:tel||'',email:'',cedula:'',dir:'',notas:'',fechaReg:today()});
      setTimeout(function(){
        var sel=document.getElementById('o-cli');
        if(sel){var opt=document.createElement('option');opt.value=newId;opt.textContent=name;opt.selected=true;sel.appendChild(opt);}
        notify('Cliente agregado: '+name);
      },600);
    }
  }catch(e){if(e.name!=='AbortError')notify('Error al acceder a contactos',true);}
}

function checkContactPickerSupport(){
  var supported='contacts' in navigator&&'ContactsManager' in window;
  var bar=document.getElementById('contact-picker-bar');
  if(bar)bar.style.display=supported?'flex':'none';
  var btn=document.getElementById('btn-import-contact-ord');
  if(btn){
    btn.style.display=supported?'':'none';
    if(supported)btn.onclick=pickContactForOrden;
  }
}

auth.onAuthStateChanged(user=>{
  document.getElementById('login-screen').style.display=user?'none':'flex';
  document.getElementById('app-screen').style.display=user?'flex':'none';
  if(user){
    document.getElementById('user-email').textContent=user.email;
    startListeners();
    renderPage('dashboard');
  } else {
    unsubs.forEach(u=>u());unsubs.length=0;
  }
});
